server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Страница
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Запросы /api/... nginx пересылает в контейнер backend по внутренней сети Docker.
    # Браузер пользователя имя «backend» не знает, а nginx внутри сети — знает.
    # Именно это решает ошибку из урока «backend:5000 ERR_NAME_NOT_RESOLVED»
    # без режима network host.
    location /api/ {
        proxy_pass http://backend:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
