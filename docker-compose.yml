services:
  # Flask-бэкенд: собирается из ./backend/Dockerfile
  backend:
    build: ./backend
    image: my-flask-app
    container_name: flask-backend
    ports:
      - "5000:5000"            # снаружи: http://localhost:5000
    environment:
      APP_ENV: production
    restart: unless-stopped    # поднимется сам после сбоя или перезагрузки
    # healthcheck берётся из Dockerfile

  # Фронтенд: готовый образ nginx + наша страница и конфиг
  frontend:
    image: nginx:1.27-alpine
    container_name: nginx-frontend
    ports:
      - "8080:80"              # http://localhost:8080 (порт 80 на Windows часто занят)
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy   # ждём, пока бэкенд реально ответит на /health
    restart: unless-stopped

# Сеть по умолчанию (bridge) создаётся автоматически: внутри неё
# контейнеры находят друг друга по имени сервиса — backend, frontend.
